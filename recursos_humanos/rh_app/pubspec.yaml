name: rh_app
description: Recursos Humanos App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  http: ^1.2.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  dio: ^5.4.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  fl_chart: ^1.2.0
  pdf: ^3.11.1
  printing: ^5.13.4
  file_picker: ^8.0.0
  open_filex: ^4.7.0
  syncfusion_flutter_pdfviewer: ^28.2.12
  universal_html: ^2.2.4
  flutter_launcher_icons: ^0.14.4
  local_auth: ^3.0.1

  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/favicon.png
    - assets/images/vitracoat.png
    - assets/docs/POLITICA VITRACOAT.pdf

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/vitracoat.png"